<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mi hoja tal cual (con filtro por nombre)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height:100%; margin:0; background:#fff; }
    /* Botón útil para móviles: abrir a pantalla completa en otra pestaña */
    .open {
      position: fixed; right: 10px; top: 10px; z-index: 10;
      background: #ffffff; border: 1px solid #dcdcdc; border-radius: 10px;
      padding: 8px 10px; color: #111; font: 14px system-ui; text-decoration: none;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    /* Iframe ocupa toda la pantalla */
    .frame {
      position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
    }
  </style>
</head>
<body>

  <!-- Enlace alterno (recomendado para celular) -->
  <a
    class="open"
    href="https://docs.google.com/spreadsheets/d/1jIAWPSvoUZom0e2kLc3gEtaEAbW_I_bRmAeWn2n-5LI/edit?rm=minimal&gid=0&fvid=1843710126#gid=0"
    target="_blank" rel="noopener"
  >Abrir en pestaña nueva</a>

  <!-- Hoja “tal cual” con pestañas inferiores y Filter View activa -->
  <iframe
    class="frame"
    src="https://docs.google.com/spreadsheets/d/1jIAWPSvoUZom0e2kLc3gEtaEAbW_I_bRmAeWn2n-5LI/edit?rm=minimal&gid=0&fvid=1843710126#gid=0"
    allowfullscreen
  ></iframe>

</body>
</html>

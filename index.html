<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Ranking interactivo - Polla 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- Google Charts Loader -->
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    :root { --bg:#0b1d3a; --card:#10264b; --txt:#e7eefc; --acc:#23c4ff; }
    html, body { height:100%; margin:0; background:#07152b; color:var(--txt);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial; }
    header { padding:16px; background:var(--bg); border-bottom:1px solid rgba(255,255,255,.08); }
    header h1 { margin:0; font-size:18px; letter-spacing:.2px; }
    .wrap { max-width:1200px; margin:0 auto; padding:16px; }
    .panel { background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:12px; }
    .filters { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-bottom:12px; }
    .filters .block { min-width:260px; background:#0c1f3f; border-radius:8px; padding:8px; border:1px solid rgba(255,255,255,.06); }
    .hint { font-size:12px; opacity:.75; margin:4px 0 0 2px; }
    /* Tabla ocupa alto disponible */
    #tbl { height: 70vh; min-height: 420px; }
    a.btn { display:inline-block; padding:8px 12px; border-radius:8px; background:var(--acc); color:#001018; font-weight:600; text-decoration:none; }
  </style>
  <script>
    // === Config de tu hoja ===
    const SHEET_ID = '1jIAWPSvoUZom0e2kLc3gEtaEAbW_I_bRmAeWn2n-5LI';
    const GID = '0';          // pestaña principal
    const RANGE_A1 = 'A3:IV';  // encabezados en la fila 3

    google.charts.load('current', { packages: ['table','controls'] });
    google.charts.setOnLoadCallback(draw);

    function getParam(name){
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    function draw() {
      // URL GViz: consulta al Sheet (pestaña por gid y rango A1)
      const base = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`;
      const params = new URLSearchParams({ gid: GID, range: RANGE_A1 });
      const url = `${base}?${params.toString()}`;

      const q = new google.visualization.Query(url);
      q.send(resp => {
        if (resp.isError()) {
          const msg = `Error en la consulta: ${resp.getMessage()} - ${resp.getDetailedMessage()}`;
          console.error(msg); document.getElementById('err').textContent = msg; return;
        }
        const data = resp.getDataTable();

        // Localiza la columna "Nombres y Apellidos" por etiqueta
        let colNombre = -1;
        for (let i=0;i<data.getNumberOfColumns();i++){
          if ((data.getColumnLabel(i) || '').trim().toLowerCase() === 'nombres y apellidos'){
            colNombre = i; break;
          }
        }
        if (colNombre === -1){
          document.getElementById('err').textContent =
            'No se encontró la columna "Nombres y Apellidos" en los encabezados.';
          return;
        }

        // Control de filtro (CategoryFilter) con caja de búsqueda
        const filtroNombre = new google.visualization.ControlWrapper({
          controlType: 'CategoryFilter',
          containerId: 'f_nombre',
          options: {
            filterColumnIndex: colNombre,
            ui: { label: 'Filtrar por Nombres y Apellidos', allowTyping: true, allowMultiple: true, caption: 'Todos' }
          }
        });

        // Tabla
        const tabla = new google.visualization.ChartWrapper({
          chartType: 'Table',
          containerId: 'tbl',
          options: {
            showRowNumber: true, width: '100%', height: '100%',
            alternatingRowStyle: true, sort: 'enable'
          }
        });

        // Dashboard: vincula control → tabla
        const dash = new google.visualization.Dashboard(document.getElementById('dash'));
        dash.bind([filtroNombre], [tabla]);

        // Precarga por URL ?nombre=...
        const nombreURL = getParam('nombre'); // ej.: ?nombre=John%20Edgar...
        if (nombreURL) filtroNombre.setState({ selectedValues: [nombreURL] });

        dash.draw(data);

        // Botón “Limpiar filtros”
        document.getElementById('clear').onclick = () => {
          filtroNombre.setState({ selectedValues: [] });
          dash.draw(data);
          history.replaceState(null, '', location.pathname);
        };
      });
    }
  </script>
</head>
<body>
  <header><div class="wrap"><h1>Ranking Participantes — Interactivo (GitHub Pages)</h1></div></header>
  <main class="wrap">
    <div class="panel">
      <div class="filters">
        <div id="f_nombre" class="block"></div>
        <a id="clear" class="btn" href="javascript:void(0)">Limpiar filtros</a>
      </div>
      <div id="dash"><div id="tbl"></div></div>
      <p id="err" class="hint"></p>
      <p class="hint">Tip: agrega <code>?nombre=John%20Edgar%20Chac%C3%B3n%20Contreras</code> al final de la URL para abrir ya filtrado.</p>
    </div>
  </main>
</body>
</html>
``

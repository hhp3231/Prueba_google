<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Visual - Hoja tal cual con filtro por nombre</title>

  <!-- Cargar Google Charts correctamente -->
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    /* Barra con el buscador */
    body{margin:0}
    .toolbar{
      padding:8px; border-bottom:1px solid #ddd;
      display:flex; gap:8px; align-items:center;
      font:14px system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
    }
    .toolbar label{font-weight:600}
    .toolbar select{padding:6px 8px}

    /* Área de tabla con scroll */
    .table-wrap{height:calc(100vh - 48px); overflow:auto}
    table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%}
    th,td{border-right:1px solid #e5e7eb; border-bottom:1px solid #e5e7eb; padding:6px 8px; background:#fff; white-space:nowrap}
    tbody tr:nth-child(odd) td{background:#fafafa}

    /* Cabeceras (fila 2 y fila 3 de la hoja) “congeladas” */
    thead th{position:sticky; z-index:3; background:#eef2ff}
    thead tr:first-child th{top:0; font-weight:700}
    thead tr:nth-child(2) th{top:var(--head1,36px); font-weight:700; background:#dbeafe}

    /* Columnas 1–3 “congeladas” (izquierda) */
    .sticky-1{position:sticky; left:0; z-index:2; background:#fff}
    .sticky-2{position:sticky; left:var(--left1,0px); z-index:2; background:#fff}
    .sticky-3{position:sticky; left:calc(var(--left1,0px) + var(--left2,0px)); z-index:2; background:#fff}

    /* Fila 1 de datos (fila 4 de Sheet) “congelada” bajo cabeceras */
    .freeze-row td{
      position:sticky; top:calc(var(--head1,36px) + var(--head2,36px));
      z-index:1; background:#fff; font-weight:600
    }
  </style>
</head>
<body>
  <!-- ÚNICO buscador solicitado -->
  <div class="toolbar">
    <label for="sel">Nombres y Apellidos:</label>
    <select id="sel">
      <option value="">— Todos —</option>
    </select>
  </div>

  <!-- Contenedor de la tabla -->
  <div class="table-wrap" id="wrap"></div>

  <script>
    // ===== Config de tu hoja =====
    const SHEET_ID = '1jIAWPSvoUZom0e2kLc3gEtaEAbW_I_bRmAeWn2n-5LI';
    const GID      = '0';     // pestaña
    const RANGE_A1 = 'A2:IV'; // incluye fila 2 y 3 para doble cabecera

    google.charts.load('current', { packages:['table'] });
    google.charts.setOnLoadCallback(draw);

    let dataTable = null;
    let r2 = [], r3 = [];      // fila 2 (encabezado visual) y fila 3 (etiquetas)
    let colIdxNombre = -1;

    function draw(){
      const base   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`;
      const params = new URLSearchParams({ gid: GID, range: RANGE_A1, _ts: Date.now().toString() }); // _ts anti-cache
      const url    = `${base}?${params.toString()}`;

      const q = new google.visualization.Query(url);
      q.send(resp => {
        if (resp.isError()){
          console.error('GViz error:', resp.getMessage(), resp.getDetailedMessage());
          return;
        }
        dataTable = resp.getDataTable();

        // Fila 2 (índice 0) y fila 3 (índice 1)
        r2 = getRow(0); r3 = getRow(1);

        // Etiquetas de columnas = fila 3
        for (let c=0;c<dataTable.getNumberOfColumns();c++){
          dataTable.setColumnLabel(c, String(r3[c] ?? ''));
        }

        // Índice de "Nombres y Apellidos"
        colIdxNombre = findCol('nombres y apellidos');

        // Llenar select con valores únicos
        fillSelect();

        // Render inicial
        render();
      });
    }

    function getRow(idx){
      const arr = [];
      for (let c=0;c<dataTable.getNumberOfColumns();c++){
        arr.push(dataTable.getValue(idx,c) ?? '');
      }
      return arr;
    }
    function findCol(labelLower){
      for (let c=0;c<dataTable.getNumberOfColumns();c++){
        if ((dataTable.getColumnLabel(c)||'').trim().toLowerCase() === labelLower) return c;
      }
      return -1;
    }

    function fillSelect(){
      const sel = document.getElementById('sel');
      sel.innerHTML = '';
      const optAll = document.createElement('option');
      optAll.value=''; optAll.textContent='— Todos —';
      sel.appendChild(optAll);

      if (colIdxNombre === -1) return;
      const set = new Set();
      for (let r=2;r<dataTable.getNumberOfRows();r++){
        const v = dataTable.getValue(r, colIdxNombre);
        if (v!=null && String(v).trim()!=='') set.add(String(v));
      }
      const arr = Array.from(set).sort((a,b)=>a.localeCompare(b,'es'));
      for (const name of arr){
        const o=document.createElement('option'); o.value=name; o.textContent=name; sel.appendChild(o);
      }
      sel.onchange = render;
    }

    function render(){
      const wrap = document.getElementById('wrap');
      wrap.innerHTML = '';

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const tr1 = document.createElement('tr');
      const tr2 = document.createElement('tr');

      const cols = dataTable.getNumberOfColumns();

      // Construir dos filas de encabezado (fila 2 y fila 3 de tu hoja)
      for (let c=0;c<cols;c++){
        const th1=document.createElement('th'); th1.textContent=r2[c] ?? '';
        const th2=document.createElement('th'); th2.textContent=dataTable.getColumnLabel(c) ?? '';

        if (c===0){ th1.classList.add('sticky-1'); th2.classList.add('sticky-1'); }
        if (c===1){ th1.classList.add('sticky-2'); th2.classList.add('sticky-2'); }
        if (c===2){ th1.classList.add('sticky-3'); th2.classList.add('sticky-3'); }

        tr1.appendChild(th1); tr2.appendChild(th2);
      }
      thead.appendChild(tr1); thead.appendChild(tr2);
      table.appendChild(thead);

      // Filtrado por selección (trae SOLO esa fila)
      const filtro = (document.getElementById('sel').value || '').trim();

      const tbody=document.createElement('tbody');
      for (let r=2;r<dataTable.getNumberOfRows();r++){
        if (filtro && colIdxNombre!==-1){
          const v = String(dataTable.getValue(r, colIdxNombre) ?? '');
          if (v !== filtro) continue;
        }
        const tr=document.createElement('tr');
        for (let c=0;c<cols;c++){
          const td=document.createElement('td');
          const v = dataTable.getValue(r,c);

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hoja tal cual + filtro por nombre</title>

  <!-- Cargar Google Charts -->
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    /* Barra con el buscador (sin cambiar tema de la hoja) */
    body{margin:0}
    .toolbar{
      padding:8px; border-bottom:1px solid #ddd;
      display:flex; gap:8px; align-items:center;
      font:14px system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
    }
    .toolbar label{font-weight:600}
    .toolbar select{padding:6px 8px}

    /* Área de tabla con scroll */
    .table-wrap{height:calc(100vh - 48px); overflow:auto}
    table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%}
    th,td{border-right:1px solid #e5e7eb; border-bottom:1px solid #e5e7eb; padding:6px 8px; background:#fff; white-space:nowrap}

    /* === Inmovilizador EXACTO: filas 1–3 fijas === */
    thead th{position:sticky; z-index:3; background:#fff}
    thead tr:first-child th{top:0}
    thead tr:nth-child(2) th{top:var(--h1,36px)}            /* fila 2 */
    /* fila 3 de datos “congelada” bajo el thead (scroll desde la 4ª) */
    .freeze-row td{
      position:sticky;
      top:calc(var(--h1,36px) + var(--h2,36px));
      z-index:1; background:#fff
    }

    /* === Inmovilizador EXACTO: columnas 1–3 fijas === */
    .stick-1{position:sticky; left:0; z-index:2; background:#fff}
    .stick-2{position:sticky; left:var(--l1,0px); z-index:2; background:#fff}
    .stick-3{position:sticky; left:calc(var(--l1,0px) + var(--l2,0px)); z-index:2; background:#fff}
  </style>
</head>
<body>

  <!-- ÚNICO buscador requerido -->
  <div class="toolbar">
    <label for="sel">Nombres y Apellidos:</label>
    <select id="sel">
      <option value="">— Todos —</option>
    </select>
  </div>

  <!-- Contenedor de la tabla -->
  <div class="table-wrap" id="wrap"></div>

  <script>
    /* ========= Config de TU hoja ========= */
    const SHEET_ID = '1jIAWPSvoUZom0e2kLc3gEtaEAbW_I_bRmAeWn2n-5LI';
    const GID      = '0';     // pestaña
    const RANGE_A1 = 'A2:IV'; // incluye fila 2 y 3 (dos cabeceras)

    google.charts.load('current', { packages:['table'] });
    google.charts.setOnLoadCallback(loadData);

    let dt=null, head2=[], head3=[], idxNombre=-1;

    function loadData(){
      const base = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`;
      const url  = `${base}?${new URLSearchParams({gid:GID, range:RANGE_A1, _ts:Date.now()})}`;
      const q = new google.visualization.Query(url);
      q.send(res=>{
        if(res.isError()){ console.error(res.getMessage(), res.getDetailedMessage()); return; }

        dt = res.getDataTable();           // fila 2 => index 0, fila 3 => index 1
        head2 = getRow(0); head3 = getRow(1);

        // Etiquetas = fila 3 (no cambiamos estilo)
        for(let c=0;c<dt.getNumberOfColumns();c++){
          dt.setColumnLabel(c, String(head3[c] ?? ''));
        }
        idxNombre = findCol('nombres y apellidos');

        fillSelect();   // cargar nombres en lista
        render();       // primera pinta
      });
    }

    function getRow(i){
      const a=[]; for(let c=0;c<dt.getNumberOfColumns();c++) a.push(dt.getValue(i,c) ?? '');
      return a;
    }
    function findCol(lblLower){
      for(let c=0;c<dt.getNumberOfColumns();c++){
        if((dt.getColumnLabel(c)||'').trim().toLowerCase()===lblLower) return c;
      }
      return -1;
    }

    function fillSelect(){
      const sel=document.getElementById('sel');
      sel.innerHTML=''; const opt=document.createElement('option');
      opt.value=''; opt.textContent='— Todos —'; sel.appendChild(opt);

      if(idxNombre===-1) return;
      const set=new Set();
      for(let r=2;r<dt.getNumberOfRows();r++){
        const v=dt.getValue(r, idxNombre); if(v!=null && String(v).trim()!=='') set.add(String(v));
      }
      Array.from(set).sort((a,b)=>a.localeCompare(b,'es'))
        .forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
      sel.onchange = render;
    }

    function render(){
      const target=document.getElementById('wrap'); target.innerHTML='';
      const tbl=document.createElement('table');
      const thead=document.createElement('thead'); const tr1=document.createElement('tr'); const tr2=document.createElement('tr');
      const cols=dt.getNumberOfColumns();

      // Cabeceras (filas 1–2 de thead) -> equivalen a FILA 2 y FILA 3 de la hoja
      for(let c=0;c<cols;c++){
        const th1=document.createElement('th'); th1.textContent=head2[c] ?? '';
        const th2=document.createElement('th'); th2.textContent=dt.getColumnLabel(c) ?? '';

        // columnas 1–3 fijas
        if(c===0){ th1.classList.add('stick-1'); th2.classList.add('stick-1'); }
        if(c===1){ th1.classList.add('stick-2'); th2.classList.add('stick-2'); }
        if(c===2){ th1.classList.add('stick-3'); th2.classList.add('stick-3'); }

        tr1.appendChild(th1); tr2.appendChild(th2);
      }
      thead.appendChild(tr1); thead.appendChild(tr2); tbl.appendChild(thead);

      const tbody=document.createElement('tbody');
      const filtro=(document.getElementById('sel').value||'').trim();

      for(let r=2;r<dt.getNumberOfRows();r++){
        if(filtro && idxNombre!==-1){
          const v=String(dt.getValue(r, idxNombre) ?? '');
          if(v!==filtro) continue;                 // mostrar SOLO esa fila
        }
        const tr=document.createElement('tr');
        for(let c=0;c<cols;c++){
          const td=document.createElement('td');
          const v=dt.getValue(r,c); td.textContent=(v==null?'':v);

          if(c===0) td.classList.add('stick-1');
          if(c===1) td.classList.add('stick-2');
          if(c===2) td.classList.add('stick-3');

          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      tbl.appendChild(tbody);
      target.appendChild(tbl);

      /* Medir alturas reales de cabeceras para fijar top de la 3ª fila */
      const h1 = tr1.getBoundingClientRect().height;
      const h2 = tr2.getBoundingClientRect().height;
      document.documentElement.style.setProperty('--h1', `${Math.round(h1)}px`);
      document.documentElement.style.setProperty('--h2', `${Math.round(h2)}px`);

      /* Marcar la PRIMERA fila de datos como 3ª fila fija (freeze en fila 3) */
      const firstData = target.querySelector('tbody tr');
      if(firstData) firstData.classList.add('freeze-row');

      /* Calcular anchos reales de col 1 y 2 para fijar izquierda de 2–3 */
      const ths = tr2.querySelectorAll('th');
      const l1 = ths[0]?.getBoundingClientRect().width || 0;
      const l2 = ths[1]?.getBoundingClientRect().width || 0;
      document.documentElement.style.setProperty('--l1', l1+'px');
      document.documentElement.style.setProperty('--l2', l2+'px');
    }
  </script>
</body>
</html>
